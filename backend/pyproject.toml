[project]
name = "jobmatchai-backend"
version = "0.1.0"
description = "JobMatchAI: job fit intelligence and truth-preserving resume tailoring"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-dateutil>=2.9",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "anthropic>=2.8.0",
    "openai>=3.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: long user-facing strings/prompts are intentional (formatter handles code).
ignore = ["RUF001", "RUF002", "RUF003", "E501", "UP047", "SIM102"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["ollama: requires a running local Ollama server", "embeddings: requires the sentence-transformers model"]
